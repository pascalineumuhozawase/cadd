
services:
  database:
    image: postgres:16
    container_name: cadd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cadd_db
      POSTGRES_USER: cadd_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./CADD-Backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadd_user -d cadd_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
    container_name: cadd-ai-service
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/models/mobilenetv2_cassava.keras
      MIN_PREDICTION_CONFIDENCE: ${MIN_PREDICTION_CONFIDENCE:-0.35}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./CADD-Backend
    container_name: cadd-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_ORIGIN: http://localhost:3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: cadd_db
      DB_USER: cadd_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./CADD-Frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    container_name: cadd-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
